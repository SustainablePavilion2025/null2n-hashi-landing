<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>null²ⁿ — Wi-Fi</title>
<style>
  :root { --bg:#030303; --fg:#f0ede8; --mut:#8d8a85; --line:#2a2a2a; --acc:#7ab8b0; }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "PingFang SC", sans-serif;
         min-height: 100vh; min-height: 100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding: max(56px, calc(env(safe-area-inset-top) + 44px)) 24px max(28px, env(safe-area-inset-bottom)); text-align:center; }
  .lang { display:flex; gap:0; position:fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; }
  .lang button { background:none; border:0; padding:9px 8px; color:var(--mut); font: 500 11px/1 system-ui, sans-serif; letter-spacing:.14em; cursor:pointer; }
  .lang button + button { border-left:1px solid var(--line); }
  .lang button[aria-pressed=true] { color:#fff; }
  h1 { margin:0; font-size: clamp(21px, 6vw, 28px); font-weight:600; line-height:1.4; }
  .ssid { font: 600 clamp(22px, 7vw, 32px)/1.2 ui-monospace, "SF Mono", Consolas, monospace; padding: 12px 18px; border:1px solid var(--line); border-radius: 12px; letter-spacing:.02em; user-select: all; -webkit-user-select: all; }
  ol { margin:0; padding:0 0 0 1.3em; text-align:left; max-width: 22em; color: var(--fg); }
  ol li { margin: 4px 0; }
  .wait { display:flex; align-items:center; gap:10px; color: var(--mut); font-size: 14px; min-height: 1.6em; }
  .dot { width:9px; height:9px; border-radius:50%; background: var(--acc); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  details { color: var(--mut); font-size: 13.5px; max-width: 24em; }
  summary { cursor:pointer; padding: 6px; }
  .qr { width: min(46vw, 190px); margin: 10px auto 4px; background:#fff; border-radius: 10px; padding: 6px; }
  .qr svg { display:block; width:100%; height:auto; }
  a.go { display:none; color: var(--fg); border:1px solid var(--line); border-radius: 99px; padding: 11px 22px; text-decoration:none; font-size: 15px; }
  a.go.on { display:inline-block; }
  .hint { display:none; color: var(--mut); font-size: 13px; max-width: 24em; margin-top:-10px; }
  .hint.on { display:block; }
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language">
  <button data-l="ja" aria-pressed="true">日本語</button><button data-l="en" aria-pressed="false">EN</button><button data-l="zh" aria-pressed="false">中文</button>
</div>
<h1 data-t="title"></h1>
<div class="ssid">null2n-Guest</div>
<ol>
  <li data-t="s1"></li>
  <li data-t="s2"></li>
  <li data-t="s3"></li>
  <li data-t="s4"></li>
</ol>
<div class="wait"><span class="dot"></span><span data-t="wait"></span></div>
<a class="go" id="go" href="https://guide.null2.nexus/" data-t="go"></a>
<div class="hint" id="hint" data-t="hint"></div>
<details>
  <summary data-t="qrsum"></summary>
  <div class="qr" aria-label="Wi-Fi QR"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h33v33H0z"/><path stroke="#000000" d="M2 2.5h7m3 0h1m1 0h1m2 0h3m1 0h1m2 0h7M2 3.5h1m5 0h1m1 0h2m2 0h3m1 0h1m2 0h1m2 0h1m5 0h1M2 4.5h1m1 0h3m1 0h1m1 0h1m4 0h1m1 0h1m2 0h2m2 0h1m1 0h3m1 0h1M2 5.5h1m1 0h3m1 0h1m1 0h1m3 0h1m3 0h2m2 0h1m1 0h1m1 0h3m1 0h1M2 6.5h1m1 0h3m1 0h1m3 0h2m3 0h2m2 0h2m1 0h1m1 0h3m1 0h1M2 7.5h1m5 0h1m3 0h1m4 0h1m1 0h1m1 0h1m2 0h1m5 0h1M2 8.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M10 9.5h1m5 0h3m2 0h2M2 10.5h1m5 0h1m1 0h1m2 0h1m4 0h1m4 0h2m2 0h3M2 11.5h3m1 0h2m2 0h3m2 0h1m2 0h1m2 0h3m2 0h4M2 12.5h1m1 0h2m1 0h3m2 0h1m2 0h5m2 0h2m1 0h1m2 0h1m1 0h1M3 13.5h2m1 0h2m2 0h1m3 0h2m4 0h2m1 0h5m1 0h2M2 14.5h5m1 0h4m3 0h1m1 0h3m1 0h3m3 0h1m1 0h1M5 15.5h1m1 0h1m3 0h1m2 0h1m3 0h1m3 0h3m1 0h3m1 0h1M2 16.5h1m3 0h1m1 0h1m2 0h1m2 0h1m4 0h1m1 0h1m3 0h1M2 17.5h1m1 0h3m2 0h1m2 0h3m2 0h1m3 0h1m1 0h8M3 18.5h6m1 0h1m2 0h1m4 0h3m2 0h1m1 0h2M2 19.5h1m1 0h1m1 0h1m2 0h2m1 0h1m1 0h3m5 0h3m1 0h1m3 0h1M2 20.5h4m1 0h2m4 0h1m3 0h1m4 0h4m2 0h3M2 21.5h1m2 0h3m2 0h1m2 0h1m1 0h1m5 0h7m1 0h2M2 22.5h1m4 0h2m4 0h2m1 0h2m4 0h9M10 23.5h1m5 0h1m3 0h3m3 0h5M2 24.5h7m3 0h2m5 0h2m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1M2 25.5h1m5 0h1m2 0h4m1 0h4m1 0h2m3 0h5M2 26.5h1m1 0h3m1 0h1m2 0h1m1 0h1m1 0h2m1 0h1m1 0h8m1 0h2M2 27.5h1m1 0h3m1 0h1m2 0h1m3 0h2m4 0h2m1 0h1m1 0h2M2 28.5h1m1 0h3m1 0h1m3 0h1m3 0h2m1 0h3m1 0h2m1 0h1m1 0h2M2 29.5h1m5 0h1m2 0h1m3 0h2m1 0h2m3 0h3m1 0h1M2 30.5h7m1 0h2m4 0h14"/></svg>
</div>
  <div data-t="qrnote"></div>
</details>
<script>
(function () {
  var SSID = "null2n-Guest", PASS = "", DIRECT = "https://guide.null2.nexus";
  var T = {
    ja: { title: '会場の Wi-Fi につないでください', s1: '設定 → Wi-Fi を開く', s2: '「' + SSID + '」を選ぶ' + (PASS ? '(パスワード: ' + PASS + ')' : '(パスワードなし)'), s3: '利用規約の画面が出たら、同意して閉じる', s4: 'この画面に戻る(自動で進みます)',
          wait: '接続を待っています…', go: 'つないだのに進まないときは、ここを押す', hint: '利用規約の画面を閉じたあと、ブラウザのこの画面に戻ってください。',
          qrsum: 'QR でつなぐ(ほかの端末で読む / iPhone は QR を長押し)', qrnote: 'この QR は Wi-Fi「' + SSID + '」への接続用です。' },
    en: { title: 'Please connect to the venue Wi-Fi', s1: 'Open Settings → Wi-Fi', s2: 'Choose "' + SSID + '"' + (PASS ? ' (password: ' + PASS + ')' : ' (no password)'), s3: 'If a terms-of-use screen appears, agree and close it', s4: 'Come back to this screen — it continues by itself',
          wait: 'Waiting for the connection…', go: 'Connected but nothing happens? Tap here', hint: 'After closing the terms-of-use screen, return to this page in your browser.',
          qrsum: 'Join by QR (scan from another device / on iPhone, press and hold the code)', qrnote: 'This code joins the Wi-Fi "' + SSID + '".' },
    zh: { title: '请连接会场 Wi-Fi', s1: '打开 设置 → Wi-Fi', s2: '选择「' + SSID + '」' + (PASS ? '(密码: ' + PASS + ')' : '(无密码)'), s3: '如出现使用条款页面,请同意并关闭', s4: '回到此页面(会自动继续)',
          wait: '正在等待连接…', go: '已连接但没有继续?请点这里', hint: '关闭使用条款页面后,请回到浏览器中的此页面。',
          qrsum: '用二维码连接(用其他设备扫描 / iPhone 请长按二维码)', qrnote: '此二维码用于连接 Wi-Fi「' + SSID + '」。' }
  };
  function setLang(l) {
    if (!T[l]) l = 'ja';
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[l][el.dataset.t]; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.l === l)); });
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.l); }); });
  var nav = (navigator.language || 'ja').toLowerCase();
  setLang(nav.indexOf('zh') === 0 ? 'zh' : nav.indexOf('ja') === 0 ? 'ja' : 'en');

  var go = document.getElementById('go');
  if (DIRECT) go.href = DIRECT + location.pathname + location.search;
  setTimeout(function () { if (DIRECT) go.classList.add('on'); document.getElementById('hint').classList.add('on'); }, 8000);

  var done = false;
  function check() {
    if (done) return;
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 1800);
    fetch('/api/z5/session?t=' + Date.now(), { cache: 'no-store', credentials: 'same-origin', signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        var relay = /application\/json/.test(r.headers.get('content-type') || '') || r.headers.get('x-null2n-relay');
        if (relay) { done = true; location.replace(location.href); }
      })
      .catch(function () { /* not switched yet / offline */ })
      .then(function () { clearTimeout(timer); });
  }
  setInterval(check, 2000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('online', check);
  check();
})();
</script>
</body>
</html>
